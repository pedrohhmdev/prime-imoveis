<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/png"
        href="prime-imoveis-favicon.png"
    >

    <title>Todos os imóveis | Prime Imóveis</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

<header class="header">

    <a href="index.html" class="logo">

        <span>PRIME</span>
        <small>IMÓVEIS</small>

    </a>

    <nav>

        <a href="index.html#inicio">Início</a>
        <a href="index.html#imoveis">Imóveis</a>
        <a href="index.html#sobre">Sobre</a>
        <a href="index.html#feedbacks">Depoimentos</a>
        <a href="index.html#contato">Contato</a>

    </nav>

    <a href="index.html#contato" class="btn-header">
        Fale conosco
    </a>

</header>

<main>

<section class="all-properties">

    <div class="catalog-top">

        <a href="index.html" class="back-button">
            ← Voltar para o início
        </a>

        <span class="section-tag">
            NOSSO CATÁLOGO
        </span>

        <h1>
            Todos os imóveis
        </h1>

        <p>
            Encontre o imóvel ideal entre nossas opções.
        </p>

    </div>

    <div class="catalog-filters">

        <div>

            <label>Pesquisar</label>

            <input
                type="text"
                id="pesquisaImovel"
                placeholder="Nome, bairro ou cidade..."
                oninput="filtrarCatalogo()"
            >

        </div>

        <div>

            <label>Localização</label>

            <select
                id="filtroLocalizacao"
                onchange="filtrarCatalogo()"
            >

                <option value="">Todas as cidades</option>

                <option value="Barueri">Barueri</option>
                <option value="São Paulo">São Paulo</option>
                <option value="Osasco">Osasco</option>
                <option value="Santo André">Santo André</option>
                <option value="Guarulhos">Guarulhos</option>
                <option value="Carapicuíba">Carapicuíba</option>
                <option value="São Bernardo do Campo">São Bernardo do Campo</option>
                <option value="São Caetano do Sul">São Caetano do Sul</option>
                <option value="Campinas">Campinas</option>
                <option value="Sorocaba">Sorocaba</option>
                <option value="Santana de Parnaíba">Santana de Parnaíba</option>

            </select>

        </div>

        <div>

            <label>Tipo</label>

            <select
                id="filtroTipo"
                onchange="filtrarCatalogo()"
            >

                <option value="">Todos</option>

                <option value="Casa">Casa</option>
                <option value="Apartamento">Apartamento</option>
                <option value="Sobrado">Sobrado</option>
                <option value="Studio">Studio</option>
                <option value="Cobertura">Cobertura</option>

            </select>

        </div>

        <div>

            <label>Finalidade</label>

            <select
                id="filtroFinalidade"
                onchange="filtrarCatalogo()"
            >

                <option value="">Todas</option>

                <option value="Venda">Venda</option>
                <option value="Aluguel">Aluguel</option>

            </select>

        </div>

        <button
            class="btn-clear-filters"
            onclick="limparFiltros()"
            type="button"
        >
            Limpar filtros
        </button>

    </div>

    <div class="catalog-result-info">

        <span id="contadorImoveis">
            30 imóveis encontrados
        </span>

    </div>

    <div
        class="all-properties-grid"
        id="todosImoveis"
    ></div>

</section>

</main>

<div
    class="modal"
    id="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitulo"
>

    <div class="modal-content">

        <button
            class="modal-close"
            onclick="fecharModal()"
            aria-label="Fechar detalhes"
        >
            ×
        </button>

        <div class="modal-gallery">

            <button
                class="gallery-arrow gallery-prev"
                onclick="fotoAnterior(event)"
                aria-label="Foto anterior"
            >
                ‹
            </button>

            <div
                class="gallery-image-container"
                id="galleryContainer"
            >

                <img
                    id="modalImagem"
                    src=""
                    alt=""
                >

            </div>

            <button
                class="gallery-arrow gallery-next"
                onclick="proximaFoto(event)"
                aria-label="Próxima foto"
            >
                ›
            </button>

            <div
                class="gallery-counter"
                id="galleryCounter"
            >
                1 / 5
            </div>

            <div
                class="gallery-dots"
                id="galleryDots"
            ></div>

        </div>

        <div class="modal-info">

            <span id="modalFinalidade"></span>

            <h2 id="modalTitulo"></h2>

            <p id="modalLocalizacao"></p>

            <div class="modal-details">

                <span id="modalQuartos"></span>
                <span id="modalBanheiros"></span>
                <span id="modalArea"></span>

            </div>

            <strong id="modalPreco"></strong>

            <a
                id="modalWhatsapp"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-primary"
            >
                Tenho interesse
            </a>

        </div>

    </div>

</div>

<footer>

    <a href="index.html" class="logo">

        <span>PRIME</span>
        <small>IMÓVEIS</small>

    </a>

    <p>
        © 2026 Prime Imóveis. Todos os direitos reservados.
    </p>

</footer>

<script src="script.js"></script>

</body>
</html>
